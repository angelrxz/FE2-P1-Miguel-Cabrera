<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda móvil</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="top-bar">
        <div class="menu-options">
          <button class="menu-button">Inicio</button>
          <button class="menu-button">Categorías</button>
          <button class="menu-button">Perfil</button>
        </div>
        <button class="cart-button">Carrito</button>
      </header>

      <main class="content-area">
        <section class="product-card">
          <div class="product-copy">
            <h1 class="product-title">Teléfono inteligente X</h1>
            <p class="product-description">
              Un diseño compacto y elegante con todas las funciones esenciales para
              tu día a día. Ideal para uso móvil, redes sociales y conectividad.
            </p>
          </div>
          <div class="product-details">
            <div class="detail-line">
              <span>Precio</span>
              <strong>$299</strong>
            </div>
            <div class="detail-line">
              <span>Stock</span>
              <strong>Disponible</strong>
            </div>
            <div class="detail-line">
              <span>Garantía</span>
              <strong>12 meses</strong>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer-bar">
        <p>© 2026 Mi Tienda Móvil</p>
      </footer>
    </div>
  </body>
</html>
