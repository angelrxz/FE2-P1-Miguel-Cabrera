<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito - Mi Tienda Móvil</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="top-bar">
        <div class="logo-area">
          <span class="brand-name">SUPERCELL</span>
          <span class="brand-tag">Celulares y accesorios</span>
        </div>
        <div class="menu-options">
          <a href="index.html" class="menu-button">Inicio</a>
          <button class="menu-button">Categorías</button>
          <button class="menu-button">Perfil</button>
        </div>
        <button class="cart-button">Carrito</button>
      </header>

      <main class="content-area">
        <section class="cart-section">
          <h2>Tu Carrito</h2>
          <div id="cart-items" class="cart-items">
            <!-- Items del carrito se agregarán aquí -->
          </div>
          <div class="cart-total">
            <p>Total: $<span id="total-price">0</span></p>
            <button class="action-button primary" id="checkout-btn">Proceder al Pago</button>
          </div>
        </section>
      </main>

      <footer class="footer-bar">
        <p>© 2026 SUPERCELL. Diseño responsive para todos los dispositivos.</p>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html></content>
